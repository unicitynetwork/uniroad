<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unitel - P2P Encrypted Messenger</title><link rel="stylesheet" href="styles.css"><script defer="defer" src="uniroad-bundle.js"></script></head><body><div class="container"><header><h1>Unitel</h1><div class="connection-status"><span id="status-indicator"></span> <span id="status-text">Disconnected</span></div></header><div class="user-info"><div class="user-details"><div>Username: <span id="username-display">Not connected</span></div><div>Public Key: <span id="pubkey-display">-</span></div></div><div class="token-count"><div>Tokens: <span id="token-count-display">0</span></div></div></div><div class="main-content"><div class="panel contacts-panel"><h2>Contacts</h2><div class="search-box"><input id="contact-search" placeholder="Search contacts..."></div><div class="panel-content" id="contacts-list"><div class="empty-message">No contacts</div></div></div><div class="panel chat-panel"><h2 id="chat-header">Select a contact</h2><div class="panel-content" id="chat-messages"><div class="empty-message">Select a contact to start chatting</div></div><div class="chat-input-area"><button id="emoji-btn" class="tool-btn">😊</button> <button id="file-btn" class="tool-btn">📎</button> <button id="token-btn" class="tool-btn">🪙</button> <input id="message-input" placeholder="Type a message..."> <button id="send-message-btn">Send</button></div></div><div class="panel call-panel"><h2>Call</h2><div class="panel-content" id="call-container"><div id="video-container"><video id="remote-video" autoplay></video><video id="local-video" autoplay muted></video></div><div id="call-controls"><div id="no-call-state"><button id="start-call-btn" class="call-btn" disabled="disabled">Call</button></div><div id="incoming-call-state" style="display:none"><p id="incoming-call-text">Incoming call from...</p><button id="answer-call-btn" class="call-btn success">Answer</button> <button id="reject-call-btn" class="call-btn danger">Reject</button></div><div id="ongoing-call-state" style="display:none"><button id="toggle-audio-btn" class="call-btn">Mute</button> <button id="toggle-video-btn" class="call-btn">Hide Video</button> <button id="end-call-btn" class="call-btn danger">End Call</button></div></div><div id="media-settings"><h3>Media Settings</h3><div class="form-group"><label for="audio-input">Microphone:</label> <select id="audio-input"></select></div><div class="form-group"><label for="video-input">Camera:</label> <select id="video-input"></select></div><button id="test-media-btn" class="action-btn">Test Devices</button></div></div></div></div><div class="action-panel"><div class="action-group"><h3>Contact Management</h3><div class="form-group"><input id="new-contact-name" placeholder="Contact username"> <button id="add-contact-btn" class="action-btn">Add Contact</button></div></div><div class="user-inventory"><h3>My Tokens</h3><div id="inventory-list" class="token-list"></div></div></div><div class="connection-panel"><h3>Connection Settings</h3><div class="form-group"><input id="server-url" placeholder="Server URL" value="wss://gateway-test1.unicity.network:7787"> <input id="room-name" placeholder="Room Name" value="unitel"> <input id="username" placeholder="Username"> <input type="password" id="secret" placeholder="Secret Key"> <button id="connect-btn" class="primary-btn">Connect</button> <button id="disconnect-btn" class="secondary-btn">Disconnect</button></div></div></div><div id="modal" class="modal"><div class="modal-content"><span class="close-btn">&times;</span><h3 id="modal-title">Confirmation</h3><div id="modal-content"><p id="modal-message"></p><div id="emoji-picker" style="display:none;"></div><div id="token-picker" style="display:none;"></div><div id="image-viewer" style="display:none;"><img id="full-image" src="" alt="Full size image"> <button id="save-image-btn" class="action-btn">Save Image</button></div></div><div class="modal-actions"><button id="modal-confirm" class="primary-btn">Confirm</button> <button id="modal-cancel" class="secondary-btn">Cancel</button></div></div></div><input type="file" id="file-input" style="display: none;"></body></html>
